[build]
builder = "nixpacks"

[deploy]
# Railway meng-inject $PORT. JANGAN hardcode 8000 — app akan dianggap mati
# karena healthcheck menembak port yang berbeda.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[nixpacks]
# Python 3.11 sesuai pengembangan lokal (3.11.16).
providers = ["python"]
