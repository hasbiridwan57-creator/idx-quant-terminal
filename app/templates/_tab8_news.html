<!-- TAB 8: LIVE NEWS FEED & CATALYST INGESTION -->
<div x-show="activeNav === 'news'" class="space-y-6">

  <!-- NEWS FILTER & SEARCH -->
  <div class="bg-[#0E1525] border border-white/[0.08] rounded-xl p-6 shadow-sm mb-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Ticker</label>
        <input @input="filterTicker = $event.target.value"
               x-model="filterTicker"
               placeholder="Contoh: ASII, BBCA, TLKM"
               class="w-full bg-[#080C14] border border-white/[0.04] rounded-lg p-3 font-mono text-white focus:outline-none focus:border-emerald-400"
               type="text">
      </div>
      <div>
        <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Katalis</label>
        <input @input="filterKeyword = $event.target.value"
               x-model="filterKeyword"
               placeholder="Contoh: dividend, capek, suku bunga"
               class="w-full bg-[#080C14] border border-white/[0.04] rounded-lg p-3 font-mono text-white focus:outline-none focus:border-emerald-400"
               type="text">
      </div>
      <div>
        <button @click="refreshNews()" 
                class="w-full bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-mono font-bold py-2.5 transition-all">
          <span>Refresh News</span>
          <svg class="w-3.5 h-3.5 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M3 4h14v2H3V4zm9.118 2.3l-3.023 1.687L19.666 6.09l-6.106 10.663L5.018 17.858 2.943 15.775l3.876-5.685L1.05 8.22l5.759-2.75L5.93 2.176z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- NEWS FEED LIST -->
  <div class="space-y-4 max-h-80 overflow-y-auto">
    <template x-for="article in filteredNewsArticles" :key="article.link">
      <div class="p-4 bg-[#080C14] border border-white/[0.04] rounded-lg hover:border-white/[0.06] transition-colors">
        <div class="flex items-start justify-between">
          <div>
            <a :href="article.link" target="_blank" class="text-[14px] font-semibold text-rose-400 hover:text-rose-300 truncate block" x-text="article.title"></a>
            <p class="text-[12px] text-slate-400 mt-1 line-clamp-2" x-text="article.description"></p>
          </div>
          <div class="text-right text-xs">
            <span class="text-slate-500 font-mono" x-text="article.source"></span>
            <span class="text-slate-600" x-text="article.pubDate"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- Empty State -->
    <div x-show="filteredNewsArticles.length === 0" class="text-center py-12 text-slate-500">
      <p class="text-[12px]">Tidak ada berita yang cocok. Ganti ticker atau kata kunci untuk mengupdate feed.</p>
    </div>
  </div>

  <!-- CATALYST IMPACT ANALYSIS PANEL -->
  <div class="bg-[#0E1525] border border-white/[0.08] rounded-xl p-6 shadow-sm mt-6">
    <h2 class="text-sm font-bold text-white uppercase tracking-wider mb-3">Analisis Katalis Berdasarkan Berita</h2>
    
    <template x-if="analysisLoading">
      <p class="text-slate-400">Sedang menganalisis dampak berita ke tesis investasi...</p>
    </template>

    <template x-else>
      <div x-show="newsAnalysis && newsAnalysis !== ''" class="text-xs text-slate-300 leading-relaxed">
        <p x-html="newsAnalysis"></p>
      </div>

      <template x-show="!newsAnalysis || newsAnalysis === ''">
        <p class="text-slate-500">Klik tombol di bawah untuk menganalisis dampak berita terkini ke tesis investasi emiten.</p>
        <button @click="analyzeNewsCatalyst()"
                class="mt-3 px-4 py-2 bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 rounded-lg text-xs font-mono flex items-center gap-2">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Analisis Dampak</span>
        </button>
      </template>
    </div>
  </div>
</div>
