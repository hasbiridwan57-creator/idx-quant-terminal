<!-- TAB 0: ADVANCED MULTI-CHART TERMINAL (1 to 4 Grid Layout) -->
<section x-show="activeNav === 'charting'" class="space-y-4">

  <!-- TRADING STATUS BANNER: jelaskan kenapa harga tidak tersedia -->
  <template x-if="tradingStatus && tradingStatus.tradable === false">
    <div class="bg-amber-500/[0.07] border border-amber-500/30 rounded-2xl p-4 flex items-start gap-3">
      <svg class="w-5 h-5 text-amber-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <div class="flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-sm font-semibold text-amber-300">Saham Tidak Diperdagangkan</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-500/15 border border-amber-500/30 text-amber-300"
                x-text="tradingStatus.reason"></span>
          <span class="text-[10px] font-mono text-amber-400/70"
                x-show="tradingStatus.since"
                x-text="'sejak ' + tradingStatus.since"></span>
        </div>
        <p class="text-xs text-amber-200/80 mt-1.5 leading-relaxed" x-text="tradingStatus.detail"></p>
        <p class="text-[10px] text-amber-200/50 mt-1.5 font-sans">
          Data fundamental (XBRL audited) tetap tersedia dan dapat dianalisis. Harga pasar &amp; valuasi relatif tidak dapat dihitung.
          Sumber: pengumuman resmi BEI/IDX.
        </p>
      </div>
    </div>
  </template>

  <!-- Header Controls: Grid Mode & Ticker Quick Bar -->
  <div class="bg-[#0E1525] border border-white/[0.06] rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>
      </div>
      <div>
        <h2 class="text-sm font-semibold text-white">Multi-Terminal Interactive Technical Charting</h2>
        <p class="text-xs text-slate-400 mt-0.5">Analisis teknikal lengkap &bull; Indikator RSI, MACD, MA &bull; Real-time IDX Composite &amp; Emiten BEI</p>
      </div>
    </div>

    <!-- Layout Switcher (1, 2, 3, 4 Charts) -->
    <div class="flex items-center gap-1.5 bg-[#090D16] border border-white/[0.06] p-1.5 rounded-xl font-mono text-xs">
      <span class="text-slate-500 text-[11px] px-2 font-sans">Layout:</span>
      
      <!-- 1 Chart (Full) -->
      <button @click="setChartLayout(1)"
              :class="chartLayout === 1 ? 'bg-sky-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'"
              class="px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1"
              title="1 Chart (Layar Penuh)">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/></svg>
        <span>1</span>
      </button>

      <!-- 2 Charts (Split Horizontal) -->
      <button @click="setChartLayout(2)"
              :class="chartLayout === 2 ? 'bg-sky-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'"
              class="px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1"
              title="2 Charts (Split 2 Kolom)">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="18" rx="1" stroke-width="2"/><rect x="13" y="3" width="8" height="18" rx="1" stroke-width="2"/></svg>
        <span>2</span>
      </button>

      <!-- 3 Charts (1 Big + 2 Small) -->
      <button @click="setChartLayout(3)"
              :class="chartLayout === 3 ? 'bg-sky-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'"
              class="px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1"
              title="3 Charts (1 Utama + 2 Sekunder)">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="10" height="18" rx="1" stroke-width="2"/><rect x="15" y="3" width="6" height="8" rx="1" stroke-width="2"/><rect x="15" y="13" width="6" height="8" rx="1" stroke-width="2"/></svg>
        <span>3</span>
      </button>

      <!-- 4 Charts (Quad Grid 2x2) -->
      <button @click="setChartLayout(4)"
              :class="chartLayout === 4 ? 'bg-sky-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'"
              class="px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1"
              title="4 Charts (Quad Grid 2x2)">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="1" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="1" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="1" stroke-width="2"/></svg>
        <span>4</span>
      </button>
    </div>
  </div>

  <!-- MULTI-CHART DYNAMIC GRID CONTAINER -->
  <div class="grid gap-4"
       :class="{
         'grid-cols-1': chartLayout === 1,
         'grid-cols-1 lg:grid-cols-2': chartLayout === 2,
         'grid-cols-1 lg:grid-cols-12': chartLayout === 3,
         'grid-cols-1 lg:grid-cols-2': chartLayout === 4
       }">

    <!-- SLOT 1: Always Visible -->
    <div class="bg-[#0E1525] border border-white/[0.06] rounded-2xl overflow-hidden flex flex-col"
         :class="chartLayout === 3 ? 'lg:col-span-8' : ''"
         style="min-height: 580px;">
      <!-- Slot 1 Header Bar -->
      <div class="h-11 px-4 bg-slate-800/30 border-b border-white/[0.06] flex items-center justify-between gap-3 font-mono text-xs">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-sky-400"></span>
          <span class="text-slate-400 font-sans text-xs">Slot 1:</span>
          <input type="text"
                 x-model="chartSlot1"
                 @keydown.enter="updateChartSlot(1, chartSlot1)"
                 placeholder="IDX:COMPOSITE"
                 class="bg-[#090D16] border border-white/[0.08] focus:border-sky-500/50 rounded-lg px-2 py-0.5 text-xs text-white uppercase font-mono w-32 focus:outline-none">
          <button @click="updateChartSlot(1, chartSlot1)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] text-sky-400 transition-colors">Apply</button>
        </div>
        <div class="flex items-center gap-2">
          <button @click="openAiCopilot(chartSlot1)"
                  class="px-2.5 py-1 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 text-[11px] font-semibold flex items-center gap-1.5 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span>AI Copilot</span>
          </button>
          <span class="text-slate-600">&bull;</span>
          <button @click="chartSlot1 = 'IDX:COMPOSITE'; updateChartSlot(1, 'IDX:COMPOSITE')" class="text-[11px] text-slate-400 hover:text-white">IHSG</button>
          <span class="text-slate-600">&bull;</span>
          <button @click="chartSlot1 = 'IDX:{{ bundle.current.ticker }}'; updateChartSlot(1, 'IDX:{{ bundle.current.ticker }}')" class="text-[11px] text-sky-400 hover:underline">{{ bundle.current.ticker }}</button>
        </div>
      </div>
      <!-- Widget Mount Point -->
      <div id="tv-chart-container-1" class="flex-1 w-full relative" style="min-height: 530px;"></div>
    </div>

    <!-- SLOT 2: Visible if chartLayout >= 2 -->
    <template x-if="chartLayout >= 2">
      <div class="bg-[#0E1525] border border-white/[0.06] rounded-2xl overflow-hidden flex flex-col"
           :class="chartLayout === 3 ? 'lg:col-span-4' : ''"
           style="min-height: 580px;">
        <!-- Slot 2 Header Bar -->
        <div class="h-11 px-4 bg-slate-800/30 border-b border-white/[0.06] flex items-center justify-between gap-3 font-mono text-xs">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span class="text-slate-400 font-sans text-xs">Slot 2:</span>
            <input type="text"
                   x-model="chartSlot2"
                   @keydown.enter="updateChartSlot(2, chartSlot2)"
                   placeholder="IDX:BBCA"
                   class="bg-[#090D16] border border-white/[0.08] focus:border-sky-500/50 rounded-lg px-2 py-0.5 text-xs text-white uppercase font-mono w-32 focus:outline-none">
            <button @click="updateChartSlot(2, chartSlot2)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] text-emerald-400 transition-colors">Apply</button>
          </div>
          <div class="flex items-center gap-2">
            <button @click="openAiCopilot(chartSlot2)"
                    class="px-2.5 py-1 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 text-[11px] font-semibold flex items-center gap-1.5 transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              <span>AI Copilot</span>
            </button>
            <span class="text-slate-600">&bull;</span>
            <button @click="chartSlot2 = 'IDX:BBCA'; updateChartSlot(2, 'IDX:BBCA')" class="text-[11px] text-slate-400 hover:text-white">BBCA</button>
            <span class="text-slate-600">&bull;</span>
            <button @click="chartSlot2 = 'IDX:ASII'; updateChartSlot(2, 'IDX:ASII')" class="text-[11px] text-slate-400 hover:text-white">ASII</button>
          </div>
        </div>
        <!-- Widget Mount Point -->
        <div id="tv-chart-container-2" class="flex-1 w-full relative" style="min-height: 530px;"></div>
      </div>
    </template>

    <!-- SLOT 3: Visible if chartLayout >= 3 -->
    <template x-if="chartLayout >= 3">
      <div class="bg-[#0E1525] border border-white/[0.06] rounded-2xl overflow-hidden flex flex-col"
           :class="chartLayout === 3 ? 'lg:col-span-12' : ''"
           style="min-height: 580px;">
        <!-- Slot 3 Header Bar -->
        <div class="h-11 px-4 bg-slate-800/30 border-b border-white/[0.06] flex items-center justify-between gap-3 font-mono text-xs">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span class="text-slate-400 font-sans text-xs">Slot 3:</span>
            <input type="text"
                   x-model="chartSlot3"
                   @keydown.enter="updateChartSlot(3, chartSlot3)"
                   placeholder="IDX:BBRI"
                   class="bg-[#090D16] border border-white/[0.08] focus:border-sky-500/50 rounded-lg px-2 py-0.5 text-xs text-white uppercase font-mono w-32 focus:outline-none">
            <button @click="updateChartSlot(3, chartSlot3)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] text-amber-400 transition-colors">Apply</button>
          </div>
          <div class="flex items-center gap-2">
            <button @click="openAiCopilot(chartSlot3)"
                    class="px-2.5 py-1 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 text-[11px] font-semibold flex items-center gap-1.5 transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              <span>AI Copilot</span>
            </button>
            <span class="text-slate-600">&bull;</span>
            <button @click="chartSlot3 = 'IDX:BBRI'; updateChartSlot(3, 'IDX:BBRI')" class="text-[11px] text-slate-400 hover:text-white">BBRI</button>
            <span class="text-slate-600">&bull;</span>
            <button @click="chartSlot3 = 'IDX:TLKM'; updateChartSlot(3, 'IDX:TLKM')" class="text-[11px] text-slate-400 hover:text-white">TLKM</button>
          </div>
        </div>
        <!-- Widget Mount Point -->
        <div id="tv-chart-container-3" class="flex-1 w-full relative" style="min-height: 530px;"></div>
      </div>
    </template>

    <!-- SLOT 4: Visible if chartLayout === 4 -->
    <template x-if="chartLayout === 4">
      <div class="bg-[#0E1525] border border-white/[0.06] rounded-2xl overflow-hidden flex flex-col"
           style="min-height: 580px;">
        <!-- Slot 4 Header Bar -->
        <div class="h-11 px-4 bg-slate-800/30 border-b border-white/[0.06] flex items-center justify-between gap-3 font-mono text-xs">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-rose-400"></span>
            <span class="text-slate-400 font-sans text-xs">Slot 4:</span>
            <input type="text"
                   x-model="chartSlot4"
                   @keydown.enter="updateChartSlot(4, chartSlot4)"
                   placeholder="IDX:ADRO"
                   class="bg-[#090D16] border border-white/[0.08] focus:border-sky-500/50 rounded-lg px-2 py-0.5 text-xs text-white uppercase font-mono w-32 focus:outline-none">
            <button @click="updateChartSlot(4, chartSlot4)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] text-rose-400 transition-colors">Apply</button>
          </div>
          <div class="flex items-center gap-2">
            <button @click="openAiCopilot(chartSlot4)"
                    class="px-2.5 py-1 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 text-[11px] font-semibold flex items-center gap-1.5 transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              <span>AI Copilot</span>
            </button>
            <span class="text-slate-600">&bull;</span>
            <button @click="chartSlot4 = 'IDX:ADRO'; updateChartSlot(4, 'IDX:ADRO')" class="text-[11px] text-slate-400 hover:text-white">ADRO</button>
            <span class="text-slate-600">&bull;</span>
            <button @click="chartSlot4 = 'IDX:ICBP'; updateChartSlot(4, 'IDX:ICBP')" class="text-[11px] text-slate-400 hover:text-white">ICBP</button>
          </div>
        </div>
        <!-- Widget Mount Point -->
        <div id="tv-chart-container-4" class="flex-1 w-full relative" style="min-height: 530px;"></div>
      </div>
    </template>

  </div>

</section>
